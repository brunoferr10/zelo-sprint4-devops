54" font-family="Arial,sans-serif" font-size="20" fill="#16394c">A aplicação é implantada no Web App. A VM hospeda o banco e precisa permanecer ligada até a avaliação.</text><text x="45" y="1090" font-family="Arial,sans-serif" font-size="19" fill="#16394c">Banco e volume ficam na nuvem Azure. O pipeline não usa ACR/ACI nem Oracle; a VM não é agente de CI/CD.</text></svg>