trigger:
  branches:
    include:
    - master
pr: none
pool:
  vmImage: ubuntu-latest
variables:
  azureSubscription: MyAzureSubscription
  WEB_APP_NAME: zelo-s4-rm563489
  APP_RG: rg-zelo-s4-webapp
stages:
- stage: CI
  displayName: CI - build, testes e artefato
  jobs:
  - job: BuildTest
    steps:
    - checkout: self
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled
    - task: Maven@4
      displayName: Maven - build e testes
      inputs:
        mavenPomFile: pom.xml
        goals: clean verify
        options: '-B -DfailIfNoTests=true'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: JDKVersion
        jdkVersionOption: '1.21'
    - bash: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/app"
        cp target/zelo-api-1.0.0.jar "$(Build.ArtifactStagingDirectory)/app/app.jar"
      displayName: Preparar JAR testado
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/app'
        artifact: app
- stage: CD
  displayName: CD - deploy Web App Linux
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - job: DeployWebApp
    steps:
    - checkout: self
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: current
        artifactName: app
        targetPath: '$(Pipeline.Workspace)/app'
    - task: AzureCLI@2
      displayName: Configurar datasource sem exibir segredos
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: python3 scripts/04-configurar-datasource.py
      env:
        APP_RG: $(APP_RG)
        WEB_APP_NAME: $(WEB_APP_NAME)
        SPRING_DATASOURCE_URL: $(SPRING_DATASOURCE_URL)
        SPRING_DATASOURCE_USERNAME: $(SPRING_DATASOURCE_USERNAME)
        SPRING_DATASOURCE_PASSWORD: $(SPRING_DATASOURCE_PASSWORD)
    - task: AzureWebApp@1
      displayName: Implantar JAR no Web App Linux
      inputs:
        azureSubscription: '$(azureSubscription)'
        appType: webAppLinux
        appName: '$(WEB_APP_NAME)'
        package: '$(Pipeline.Workspace)/app/app.jar'
        runtimeStack: 'JAVA|21-java21'
        startUpCommand: 'java -jar /home/site/wwwroot/app.jar'
    - task: AzureCLI@2
      displayName: Verificar aplicacao online
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: bash
        scriptLocation: scriptPath
        scriptPath: scripts/05-testar-webapp.sh
      env:
        APP_RG: $(APP_RG)
        WEB_APP_NAME: $(WEB_APP_NAME)
